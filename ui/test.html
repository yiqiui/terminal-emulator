<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal Emulator</title>
    <style>
      /* DBX Host Bridge injects --color-* / --radius / --font-* tokens from the
         active theme; fall back to a dark palette before ready. */
      html { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--color-background, #131416);
        color: var(--color-foreground, #d7d7db);
        font-family: var(--font-sans, "Segoe UI", system-ui, sans-serif);
        font-size: 13px;
      }
      #app { display: flex; flex-direction: column; height: 100%; }

      /* ── Toolbar ─────────────────────────────────────────────── */
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        background: var(--color-card, #1b1b1e);
        border-bottom: 1px solid var(--color-border, rgba(255,255,255,0.08));
        flex: none;
        user-select: none;
        position: relative;
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13px; margin-right: 4px; }
      .brand svg { display: block; }
      #badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
        background: color-mix(in srgb, var(--color-muted, #333) 72%, transparent);
        color: var(--color-muted-foreground, #8b8b92);
        white-space: nowrap;
      }
      #badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      #badge.running { color: #3fb984; background: color-mix(in srgb, #3fb984 14%, transparent); }
      #badge.exited  { color: var(--color-destructive, #ff5d5d); background: color-mix(in srgb, var(--color-destructive, #ff5d5d) 13%, transparent); }
      #badge.starting { color: var(--color-primary, #4d7cff); background: color-mix(in srgb, var(--color-primary, #4d7cff) 13%, transparent); }
      .spacer { flex: 1; }
      select, .btn {
        font: inherit; font-size: 12px; color: var(--color-foreground);
        background: var(--color-secondary, rgba(255,255,255,0.05));
        border: 1px solid var(--color-border, transparent);
        border-radius: var(--radius, 8px);
        padding: 5px 10px; cursor: pointer; line-height: 1.4;
        transition: background 0.12s ease;
      }
      select:hover, .btn:hover { background: var(--color-accent, rgba(255,255,255,0.1)); }
      select:focus-visible, .btn:focus-visible { outline: 2px solid var(--color-ring, var(--color-primary)); outline-offset: 1px; }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn.primary { color: var(--color-primary-foreground, #fff); background: var(--color-primary, #4d7cff); border-color: transparent; font-weight: 600; }
      .btn.primary:hover { background: color-mix(in srgb, var(--color-primary, #4d7cff) 86%, black); }
      .btn.icon { padding: 5px 8px; display: inline-flex; align-items: center; }
      .btn.icon svg { display: block; }
      .group { display: inline-flex; gap: 0; }
      .group .btn { border-radius: 0; margin-left: -1px; }
      .group .btn:first-child { border-radius: var(--radius, 8px) 0 0 var(--radius, 8px); margin-left: 0; }
      .group .btn:last-child { border-radius: 0 var(--radius, 8px) var(--radius, 8px) 0; }
      .divider { width: 1px; height: 18px; background: var(--color-border, rgba(255,255,255,0.1)); margin: 0 4px; }

      /* ── Tab strip ───────────────────────────────────────────── */
      #tabs {
        display: flex; align-items: stretch; gap: 4px;
        padding: 5px 10px 0;
        background: var(--color-card, #1b1b1e);
        border-bottom: 1px solid var(--color-border, rgba(255,255,255,0.08));
        flex: none; overflow-x: auto; scrollbar-width: none; user-select: none;
      }
      #tabs::-webkit-scrollbar { display: none; }
      .tab {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 5px 10px;
        border-radius: var(--radius, 8px) var(--radius, 8px) 0 0;
        border: 1px solid transparent; border-bottom: none;
        color: var(--color-muted-foreground, #8b8b92);
        cursor: pointer; font-size: 12px; max-width: 200px; white-space: nowrap;
      }
      .tab:hover { background: var(--color-accent, rgba(255,255,255,0.06)); }
      .tab.active {
        color: var(--color-foreground);
        background: var(--color-background, #131416);
        border-color: var(--color-border, rgba(255,255,255,0.08));
      }
      .tab .tstate { width: 6px; height: 6px; border-radius: 50%; flex: none; }
      .tab .tstate.running { background: #3fb984; }
      .tab .tstate.exited { background: var(--color-destructive, #ff5d5d); }
      .tab .tname { overflow: hidden; text-overflow: ellipsis; }
      .tab .tclose {
        border: none; background: transparent; color: inherit; cursor: pointer;
        font-size: 13px; line-height: 1; padding: 0 2px; border-radius: 4px; opacity: 0.6;
      }
      .tab .tclose:hover { opacity: 1; background: var(--color-accent, rgba(255,255,255,0.12)); }
      #new-tab {
        align-self: center; border: none; background: transparent;
        color: var(--color-muted-foreground); cursor: pointer;
        font-size: 16px; padding: 2px 8px; border-radius: 6px;
      }
      #new-tab:hover { background: var(--color-accent, rgba(255,255,255,0.1)); color: var(--color-foreground); }

      /* ── Pane area ───────────────────────────────────────────── */
      #panes { flex: 1; min-height: 0; position: relative; display: flex; }
      .split { display: flex; flex: 1; min-width: 0; min-height: 0; gap: 4px; }
      .split.h { flex-direction: row; }
      .split.v { flex-direction: column; }
      .split > * { flex: 1 1 50%; min-width: 0; min-height: 0; }
      .pane {
        position: relative; display: flex; min-width: 0; min-height: 0;
        flex: 1 1 auto; width: 100%; height: 100%;
        border: 1px solid transparent;
        border-radius: calc(var(--radius, 8px) - 2px);
        padding: 3px;
      }
      .pane.active { border-color: color-mix(in srgb, var(--color-primary, #4d7cff) 55%, transparent); }
      .pane .term-host { flex: 1 1 auto; width: 100%; min-width: 0; min-height: 0; }
      .pane .term-host > * { width: 100%; height: 100%; }
      .pane-corner {
        position: absolute; top: 5px; right: 8px; z-index: 12;
        display: none; align-items: center; gap: 4px;
      }
      .pane.active .pane-corner { display: inline-flex; }
      .pane-corner .btn { padding: 2px 7px; font-size: 11px; }
      .pane-exit {
        position: absolute; inset: 0; z-index: 11;
        display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
        background: color-mix(in srgb, var(--color-background, #131416) 80%, transparent);
        backdrop-filter: blur(2px);
        border-radius: inherit;
      }
      .pane-exit.show { display: flex; }
      .pane-exit .code { font-family: var(--font-mono, monospace); font-size: 12px; color: var(--color-muted-foreground); }

      /* ── Search / SSH bars ───────────────────────────────────── */
      #searchbar {
        display: none; position: absolute; top: 10px; right: 20px; z-index: 20;
        align-items: center; gap: 4px; padding: 5px 7px;
        border-radius: var(--radius, 8px);
        background: var(--color-card, #1e1e20);
        border: 1px solid var(--color-border, rgba(255,255,255,0.1));
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      }
      #searchbar.show { display: flex; }
      #searchbar input, #sshbar input {
        font: inherit; font-size: 12px; padding: 4px 8px;
        color: var(--color-foreground);
        background: var(--color-background);
        border: 1px solid var(--color-border);
        border-radius: calc(var(--radius, 8px) - 2px);
        outline: none;
      }
      #searchbar input { width: 170px; }
      #searchbar .count { font-size: 11px; color: var(--color-muted-foreground); min-width: 46px; text-align: center; }
      #sshbar {
        display: none; position: absolute; top: calc(100% + 4px); right: 12px; z-index: 30;
        align-items: center; gap: 5px; padding: 7px 9px;
        border-radius: var(--radius, 8px);
        background: var(--color-card, #1e1e20);
        border: 1px solid var(--color-border, rgba(255,255,255,0.1));
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      }
      #sshbar.show { display: flex; }
      #sshbar .at { color: var(--color-muted-foreground); }

      /* ── Status bar ──────────────────────────────────────────── */
      #status {
        flex: none; display: flex; align-items: center; gap: 12px;
        padding: 4px 12px;
        border-top: 1px solid var(--color-border, rgba(255,255,255,0.08));
        background: var(--color-card, #1b1b1e);
        color: var(--color-muted-foreground, #8b8b92);
        font-size: 11px; font-family: var(--font-mono, monospace); white-space: nowrap;
      }
      #fatal {
        display: none; margin: 14px; padding: 14px 16px;
        border-radius: var(--radius, 8px);
        border: 1px solid color-mix(in srgb, var(--color-destructive, #ff5d5d) 40%, transparent);
        background: color-mix(in srgb, var(--color-destructive, #ff5d5d) 8%, transparent);
        color: var(--color-destructive, #ff5d5d);
        font-family: var(--font-mono, monospace); font-size: 12px; white-space: pre-wrap;
      }

      /* ── Modal / panels (phase 2-4) ─────────────────────────── */
      #connbar {
        display: none; position: absolute; top: calc(100% + 4px); right: 12px; z-index: 30;
        align-items: center; gap: 5px; padding: 7px 9px;
        border-radius: var(--radius, 8px);
        background: var(--color-card, #1e1e20);
        border: 1px solid var(--color-border, rgba(255,255,255,0.1));
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      }
      #connbar.show { display: flex; }
      #connbar input { font: inherit; font-size: 12px; padding: 4px 8px; color: var(--color-foreground);
        background: var(--color-background); border: 1px solid var(--color-border);
        border-radius: calc(var(--radius, 8px) - 2px); outline: none; }
      #workbench { display: flex; flex: 1; min-height: 0; }
      #rail-left, #rail-right {
        width: 42px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 10px 0; background: var(--color-card, #1b1b1e);
        border-right: 1px solid var(--color-border, rgba(255,255,255,0.08));
      }
      #rail-right { border-right: none; border-left: 1px solid var(--color-border, rgba(255,255,255,0.08)); }
      .rail-btn {
        width: 30px; height: 30px; border: none; background: transparent; cursor: pointer;
        color: var(--color-muted-foreground, #8b8b92); font-size: 15px;
        border-radius: var(--radius, 8px); display: flex; align-items: center; justify-content: center;
      }
      .rail-btn:hover { background: var(--color-accent, rgba(255,255,255,0.1)); color: var(--color-foreground); }
      .rail-btn.active { background: color-mix(in srgb, var(--color-primary, #4d7cff) 18%, transparent); color: var(--color-primary, #4d7cff); }
      #panel-left {
        width: 260px; flex: none; display: none; flex-direction: column; gap: 8px; padding: 10px;
        background: var(--color-card, #1b1b1e);
        border-right: 1px solid var(--color-border, rgba(255,255,255,0.08));
        overflow: hidden;
      }
      #panel-left.show { display: flex; }
      .sftp-title { font-weight: 700; font-size: 12px; color: var(--color-muted-foreground); }
      #panel-right {
        width: 250px; flex: none; display: none; flex-direction: column; gap: 8px; padding: 10px;
        background: var(--color-card, #1b1b1e);
        border-left: 1px solid var(--color-border, rgba(255,255,255,0.08));
        overflow-y: auto;
      }
      #panel-right.show { display: flex; }
      .mon-title { font-weight: 700; font-size: 12px; color: var(--color-muted-foreground); }
      .mon-card { border: 1px solid var(--color-border, rgba(255,255,255,0.08)); border-radius: var(--radius, 8px); padding: 8px; }
      .mon-name { font-size: 11px; font-weight: 650; margin-bottom: 5px; color: var(--color-foreground); }
      .mon-name span { color: var(--color-muted-foreground); font-weight: 500; float: right; }
      .mon-line { font-size: 11px; color: var(--color-muted-foreground); font-family: var(--font-mono, monospace); }
      .mon-bar { height: 6px; border-radius: 3px; background: var(--color-muted, #333); overflow: hidden; margin: 4px 0; }
      .bar-fill { height: 100%; width: 0%; background: var(--color-primary, #4d7cff); transition: width 0.4s ease; }
      .core-row { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--color-muted-foreground); margin: 2px 0; }
      .core-row .cbar { flex: 1; height: 4px; background: var(--color-muted, #333); border-radius: 2px; overflow: hidden; }
      .core-row .cfill { height: 100%; background: #3fb984; }
      #quickbar {
        flex: none; display: flex; align-items: center; gap: 6px;
        padding: 5px 10px; background: var(--color-card, #1b1b1e);
        border-top: 1px solid var(--color-border, rgba(255,255,255,0.08));
        overflow-x: auto; user-select: none;
      }
      .qb-title { font-size: 11px; color: var(--color-muted-foreground); flex: none; }
      #qb-chips { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
      .qb-chip {
        flex: none; display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
        background: var(--color-secondary, rgba(255,255,255,0.05));
        border: 1px solid var(--color-border, transparent); color: var(--color-foreground);
        font-family: var(--font-mono, monospace);
      }
      .qb-chip:hover { background: var(--color-accent, rgba(255,255,255,0.1)); }
      .qb-chip .qx { opacity: 0.55; cursor: pointer; }
      .qb-chip .qx:hover { opacity: 1; }
      #sftp-panel { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 8px; }
      .sftp-head { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
      .sftp-path-label { font-size: 11px; color: var(--color-muted-foreground); }
      #sftp-panel input, #sftp-panel select { font: inherit; font-size: 12px; padding: 4px 8px;
        color: var(--color-foreground); background: var(--color-background);
        border: 1px solid var(--color-border); border-radius: calc(var(--radius, 8px) - 2px); outline: none; }
      #sftp-list { flex: 1; overflow-y: auto; border: 1px solid var(--color-border);
        border-radius: calc(var(--radius, 8px) - 2px); }
      .sftp-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px;
        font-size: 12px; cursor: pointer; font-family: var(--font-mono, monospace); }
      .sftp-row:hover { background: var(--color-accent, rgba(255,255,255,0.08)); }
      .sftp-row .size { color: var(--color-muted-foreground); font-size: 11px; margin-left: auto; }
      .sftp-row .act { border: none; background: transparent; color: var(--color-muted-foreground);
        cursor: pointer; font-size: 11px; padding: 0 4px; border-radius: 4px; }
      .sftp-row .act:hover { color: var(--color-foreground); background: var(--color-accent, rgba(255,255,255,0.12)); }
      .sftp-foot { display: flex; gap: 5px; align-items: center; }
      #sftp-status { font-size: 11px; color: var(--color-muted-foreground); }
      #settings-modal, #palette-modal {
        display: none; position: fixed; inset: 0; z-index: 100;
        background: rgba(0,0,0,0.45); align-items: flex-start; justify-content: center;
      }
      #settings-modal.show, #palette-modal.show { display: flex; }
      .modal-card, .palette-card {
        margin-top: 80px; width: 380px; max-width: 92vw;
        background: var(--color-card, #1b1b1e); color: var(--color-foreground);
        border: 1px solid var(--color-border); border-radius: var(--radius, 10px);
        padding: 16px; display: flex; flex-direction: column; gap: 10px;
        box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      }
      .palette-card { margin-top: 60px; }
      .modal-title { font-weight: 700; font-size: 14px; }
      #settings-modal label { display: flex; align-items: center; justify-content: space-between;
        gap: 10px; font-size: 12px; color: var(--color-muted-foreground); }
      #settings-modal select, #settings-modal input {
        font: inherit; font-size: 12px; width: 180px; padding: 4px 8px;
        color: var(--color-foreground); background: var(--color-background);
        border: 1px solid var(--color-border); border-radius: calc(var(--radius, 8px) - 2px); outline: none; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
      #palette-input { width: 100%; font: inherit; font-size: 13px; padding: 8px 10px;
        color: var(--color-foreground); background: var(--color-background);
        border: 1px solid var(--color-border); border-radius: calc(var(--radius, 8px) - 2px); outline: none; }
      #palette-list { max-height: 300px; overflow-y: auto; }
      .palette-item { display: flex; gap: 8px; padding: 7px 10px; font-size: 12px; cursor: pointer;
        border-radius: calc(var(--radius, 8px) - 2px); }
      .palette-item:hover, .palette-item.sel { background: var(--color-accent, rgba(255,255,255,0.1)); }
      .palette-item .key { margin-left: auto; color: var(--color-muted-foreground); font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app">
    <div id="workbench">
      <div id="rail-left">
        <button id="rail-files" class="rail-btn active" title="文件资源管理器">📁</button>
        <button id="rail-conn" class="rail-btn" title="连接向导">🔗</button>
        <button id="rail-palette" class="rail-btn" title="命令面板">⌘</button>
      </div>
      <div id="panel-left">
      <div id="sftp-panel" class="show">
        <div class="sftp-title">文件资源管理器</div>
        <div class="sftp-head">
          <input id="sftp-host" placeholder="主机" style="width:100px" />
          <input id="sftp-user" placeholder="用户名（可空）" style="width:80px" />
          <input id="sftp-port" placeholder="22" style="width:44px" />
          <button id="sftp-open" class="btn primary">连接</button>
        </div>
        <div class="sftp-head">
          <span class="sftp-path-label">路径</span>
          <input id="sftp-path" value="/root" style="flex:1" />
          <button id="sftp-refresh" class="btn">刷新</button>
        </div>
        <div id="sftp-list"></div>
        <div class="sftp-foot">
          <button id="sftp-mkdir" class="btn">新建目录</button>
          <button id="sftp-upload" class="btn">上传</button>
          <span id="sftp-status" style="flex:1;text-align:right"></span>
        </div>
      </div>
      </div>
      <div id="main-col">
      <div id="toolbar">
        <span class="brand">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="2" width="14" height="12" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4.5 6l3 2.5-3 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.8 11.5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="title">Terminal</span>
        </span>
        <span id="badge" class="starting"><span class="dot"></span><span id="badge-text">…</span></span>
        <span class="spacer"></span>
        <select id="shell" title="Shell"></select>
        <span class="divider"></span>
        <span class="group">
          <button id="split-h" class="btn icon" title="Split right">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.5v11" stroke="currentColor" stroke-width="1.4"/><path d="M4 6h2.6M4 8h2.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          </button>
          <button id="split-v" class="btn icon" title="Split down">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 8h13" stroke="currentColor" stroke-width="1.4"/><path d="M4 5h2.6M4 7h2.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          </button>
          <button id="close-pane" class="btn icon" title="Close pane">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </span>
        <span class="divider"></span>
        <span class="group">
          <button id="font-minus" class="btn icon" title="Smaller font">A−</button>
          <button id="font-plus" class="btn icon" title="Larger font">A+</button>
        </span>
        <button id="search-toggle" class="btn icon" title="Search (Ctrl+F)">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="ssh-toggle" class="btn icon" title="SSH">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <rect x="1.5" y="2" width="13" height="9" rx="1.8" stroke="currentColor" stroke-width="1.4"/>
            <path d="M5 11.5v1.2c0 .7.6 1.3 1.3 1.3h3.4c.7 0 1.3-.6 1.3-1.3v-1.2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M5.4 5.2l2 1.9-2 1.9M8.4 9.4h2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="record-toggle" class="btn icon" title="导出会话日志">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/></svg>
        </button>

      <div id="fatal"></div>

    <script src="test-bridge.js"></script>
    <script>
      "use strict";

      const I18N = {
        en: {
          title: "Terminal",
          starting: "Starting", running: "Running", exited: "Exited",
          restart: "Restart", clear: "Clear",
          exitLine: (code) => `Process exited with code ${code}`,
          noHost: "DBX plugin host bridge not found.",
          loadFail: "Failed to load terminal assets from the plugin package.",
          startFail: (msg) => `Failed to start shell: ${msg}`,
          searchHint: "Ctrl+Shift+C copy · Ctrl+V paste · Ctrl+F search",
          none: "—",
          sshTarget: (t) => `ssh ${t}`,
          tab: (n) => `Terminal ${n}`,
        },
        "zh-CN": {
          title: "终端",
          starting: "启动中", running: "运行中", exited: "已退出",
          restart: "重启", clear: "清屏",
          exitLine: (code) => `进程已退出，退出码 ${code}`,
          noHost: "未找到 DBX 插件宿主桥。",
          loadFail: "从插件包加载终端资源失败。",
          startFail: (msg) => `启动 Shell 失败：${msg}`,
          searchHint: "Ctrl+Shift+C 复制 · Ctrl+V 粘贴 · Ctrl+F 搜索",
          none: "—",
          sshTarget: (t) => `ssh ${t}`,
          tab: (n) => `终端 ${n}`,
        },
      };

      const SHELLS = [
        { value: "powershell", label: "PowerShell" },
        { value: "pwsh", label: "PowerShell Core" },
        { value: "cmd", label: "CMD" },
        { value: "bash", label: "Bash" },
      ];

      const $ = (id) => document.getElementById(id);
      const ui = {
        title: $("title"), badge: $("badge"), badgeText: $("badge-text"), shell: $("shell"),
        clear: $("clear"), restart: $("restart"), splitH: $("split-h"), splitV: $("split-v"), closePane: $("close-pane"),
        fontMinus: $("font-minus"), fontPlus: $("font-plus"),
        searchToggle: $("search-toggle"), searchbar: $("searchbar"), searchInput: $("search-input"),
        searchCount: $("search-count"), searchPrev: $("search-prev"), searchNext: $("search-next"), searchClose: $("search-close"),
        sshToggle: $("ssh-toggle"), sshbar: $("sshbar"), sshUser: $("ssh-user"),
        sshHost: $("ssh-host"), sshPort: $("ssh-port"), sshConnect: $("ssh-connect"), sshCancel: $("ssh-cancel"),
        tabs: $("tabs"), panes: $("panes"),
        statusGeom: $("status-geom"), statusShell: $("status-shell"), statusHint: $("status-hint"),
        fatal: $("fatal"),
        recordToggle: $("record-toggle"), sftpToggle: $("sftp-toggle"), settingsToggle: $("settings-toggle"),
        railFiles: $("rail-files"), railConn: $("rail-conn"), railPalette: $("rail-palette"),
        railMonitor: $("rail-monitor"), railSettings: $("rail-settings"),
        panelLeft: $("panel-left"), panelRight: $("panel-right"),
        qbChips: $("qb-chips"), qbInput: $("qb-input"), qbAdd: $("qb-add"),
        connbar: $("connbar"), connType: $("conn-type"), connHost: $("conn-host"), connPort: $("conn-port"),
        connUser: $("conn-user"), serialPorts: $("serial-ports"), serialBaud: $("serial-baud"),
        connGo: $("conn-go"), connCancel: $("conn-cancel"),
        sftpPanel: $("sftp-panel"), sftpHost: $("sftp-host"), sftpUser: $("sftp-user"), sftpPort: $("sftp-port"),
        sftpPath: $("sftp-path"), sftpOpen: $("sftp-open"), sftpRefresh: $("sftp-refresh"), sftpClose: $("sftp-close"),
        sftpList: $("sftp-list"), sftpMkdir: $("sftp-mkdir"), sftpUpload: $("sftp-upload"), sftpStatus: $("sftp-status"),
        settingsModal: $("settings-modal"), settingsSave: $("settings-save"), settingsClose: $("settings-close"),
        setFont: $("set-font"), setFontsize: $("set-fontsize"), setScrollback: $("set-scrollback"),
        setCursor: $("set-cursor"), setBlink: $("set-blink"), setPalette: $("set-palette"),
        paletteModal: $("palette-modal"), paletteInput: $("palette-input"), paletteList: $("palette-list"),
      };

      const APP_VERSION = "0.1.10";
      let copy = I18N.en;
      let fontSize = 13;
      let xtermReady = false;
      let activeShellLabel = "";
      let sshTarget = null;
      let availableShells = [];
      let settings = { fontFamily: null, fontSize: 13, scrollback: 10000, cursorStyle: "block", cursorBlink: true, palette: "auto" };
      let recording = false;

      /* ── Model ─────────────────────────────────────────────────
         tab  = { id, name, root }
         tree = { kind:"pane", id, parent } | { kind:"split", dir:"h"|"v", a, b, parent }
         pane = { id, el, term, fit, search, session:{id, exited, code, shell, displayName} } */
      let nextPaneId = 1;
      let nextTabId = 1;
      let nextTabNumber = 1;
      const panesById = new Map();
      const tabs = [];
      let activeTabId = null;
      let activePaneId = null;

      function activeTab() { return tabs.find((tab) => tab.id === activeTabId) || null; }
      function activePane() { return panesById.get(activePaneId) || null; }
      function ensureActivePane() {
        let pane = activePane();
        if (pane && pane.term) return pane;
        const tab = activeTab();
        if (!tab) return null;
        const first = { id: null };
        forTree(tab.root, (p) => { if (first.id === null && p.term) first.id = p.id; });
        if (first.id === null) return null;
        activePaneId = first.id;
        return panesById.get(activePaneId);
      }
      function paneBySession(sid) {
        for (const [, pane] of panesById) if (pane.session && pane.session.id === sid) return pane;
        return null;
      }
      function forTree(node, fn) {
        if (!node) return;
        if (node.kind === "pane") fn(node);
        else { forTree(node.a, fn); forTree(node.b, fn); }
      }
      function collectSessions(node, out) {
        forTree(node, (pane) => { if (pane.session && pane.session.id !== null) out.push(pane.session.id); });
      }

      /* ── Theme ───────────────────────────────────────────────── */
      function appearanceMode() {
        if (settings.palette === "dark" || settings.palette === "light") return settings.palette;
        const theme = window.dbxPlugin && window.dbxPlugin.theme;
        if (theme && theme.appearance) return theme.appearance;
        return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      function xtermPalette() {
        const mode = appearanceMode();
        const css = (name, fallback) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
        const hex = (value, fallback) => {
          const match = value.match(/rgba?\(\s*(\d+)\s+(\d+)\s+(\d+)/) || value.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
          return match ? "#" + [match[1], match[2], match[3]].map((n) => Number(n).toString(16).padStart(2, "0")).join("") : fallback;
        };
        return {
          background: hex(css("--color-background", ""), mode === "light" ? "#ffffff" : "#101418"),
          foreground: hex(css("--color-foreground", ""), mode === "light" ? "#1c2333" : "#d7d7db"),
          cursor: hex(css("--color-primary", ""), "#4d7cff"),
          cursorAccent: hex(css("--color-background", ""), "#101418"),
          selectionBackground: mode === "light" ? "rgba(47,93,245,0.25)" : "rgba(77,124,255,0.35)",
          brightBlack: hex(css("--color-muted-foreground", ""), mode === "light" ? "#6b7280" : "#71717a"),
          ...(mode === "light" ? { black: "#4a4a52", brightWhite: "#ffffff" } : { black: "#101418", brightWhite: "#f5f5f7" }),
          red: "#e5484d", green: "#30a46c", yellow: "#f5a623", blue: "#3b82f6",
          magenta: "#a855f7", cyan: "#0ea5e9", white: "#d4d4d8",
          brightRed: "#ff6369", brightGreen: "#54c08a", brightYellow: "#ffb224",
          brightBlue: "#6ba6ff", brightMagenta: "#c084fc", brightCyan: "#38bdf8",
        };
      }

      function applyLocale(locale) {
        copy = I18N[locale] || I18N.en;
        document.documentElement.lang = locale || "en";
        ui.title.textContent = copy.title;
        ui.clear.textContent = copy.clear;
        ui.restart.textContent = copy.restart;
        ui.statusHint.textContent = copy.searchHint;
        renderTabs();
      }

      function setBadge(state, text) { ui.badge.className = state; ui.badgeText.textContent = text; }
      function updateBadge() {
        const pane = activePane();
        if (!pane || !pane.session) { setBadge("starting", copy.starting); return; }
        if (pane.session.exited) setBadge("exited", `${copy.exited} · ${pane.session.code ?? "?"}`);
        else setBadge("running", copy.running);
      }
      function updateStatus() {
        document.getElementById("status-ver").textContent = "v" + APP_VERSION;
        const pane = activePane();
        ui.statusGeom.textContent = pane && pane.term ? `${pane.term.cols} × ${pane.term.rows}` : copy.none;
        ui.statusShell.textContent = pane && pane.session ? (pane.session.displayName || pane.session.shell) : copy.none;
      }
      function showFatal(message) { ui.fatal.style.display = "block"; ui.fatal.textContent = message; }

      /* ── Assets ──────────────────────────────────────────────── */
      function b64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }
      async function loadAssetText(path) {
        const asset = await window.dbxPlugin.readAsset(path);
        return new TextDecoder().decode(b64ToBytes(asset.dataBase64));
      }
      function loadScriptText(code) {
        const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = url;
          script.onload = () => { URL.revokeObjectURL(url); resolve(); };
          script.onerror = () => reject(new Error("blob script load failed"));
          document.head.appendChild(script);
        });
      }
      function injectCss(code) {
        const style = document.createElement("style");
        style.textContent = code;
        document.head.appendChild(style);
      }

      /* ── Sessions ────────────────────────────────────────────── */
      function packFrame(sessionId, bytes) {
        const frame = new Uint8Array(4 + bytes.length);
        new DataView(frame.buffer).setUint32(0, sessionId, true);
        frame.set(bytes, 4);
        return frame;
      }

      function makeTerm() {
        const mono = getComputedStyle(document.documentElement).getPropertyValue("--font-mono") || '"Cascadia Mono", Consolas, ui-monospace, monospace';
        return new window.Terminal({
          fontFamily: settings.fontFamily || mono,
          fontSize: settings.fontSize,
          lineHeight: 1.2,
          cursorBlink: settings.cursorBlink,
          cursorStyle: settings.cursorStyle,
          allowProposedApi: true,
          scrollback: settings.scrollback,
          theme: xtermPalette(),
        });
      }

      function applySettingsToPanes() {
        for (const [, pane] of panesById) {
          if (!pane.term) continue;
          const mono = getComputedStyle(document.documentElement).getPropertyValue("--font-mono") || '"Cascadia Mono", Consolas, monospace';
          pane.term.options.fontFamily = settings.fontFamily || mono;
          pane.term.options.fontSize = settings.fontSize;
          pane.term.options.scrollback = settings.scrollback;
          pane.term.options.cursorBlink = settings.cursorBlink;
          pane.term.options.cursorStyle = settings.cursorStyle;
          pane.term.options.theme = xtermPalette();
        }
        scheduleFit();
      }

      async function loadSettings() {
        try {
          const saved = await window.dbxPlugin.storage.get("terminalSettings");
          if (saved && typeof saved === "object") settings = { ...settings, ...saved };
        } catch { /* storage unavailable */ }
        ui.setFont.value = settings.fontFamily || '"Cascadia Mono", Consolas, monospace';
        ui.setFontsize.value = settings.fontSize;
        ui.setScrollback.value = settings.scrollback;
        ui.setCursor.value = settings.cursorStyle;
        ui.setBlink.checked = settings.cursorBlink;
        ui.setPalette.value = settings.palette;
        fontSize = settings.fontSize;
      }
      async function saveSettings() {
        settings = {
          fontFamily: ui.setFont.value, fontSize: Number(ui.setFontsize.value) || 13,
          scrollback: Number(ui.setScrollback.value) || 10000,
          cursorStyle: ui.setCursor.value, cursorBlink: ui.setBlink.checked,
          palette: ui.setPalette.value,
        };
        try { await window.dbxPlugin.storage.set("terminalSettings", settings); } catch { /* storage unavailable */ }
        applySettingsToPanes();
      }

      function openSettings() { ui.settingsModal.classList.add("show"); }
      function closeSettings() { ui.settingsModal.classList.remove("show"); }

      /* ── Command palette (Ctrl+Shift+P) ── */
      const PALETTE_ACTIONS = [
        { name: "新标签页", key: "+", run: () => newTab() },
        { name: "向右分屏", key: "split-h", run: () => splitActive("h") },
        { name: "向下分屏", key: "split-v", run: () => splitActive("v") },
        { name: "关闭当前面板", key: "close-pane", run: () => closeActivePane() },
        { name: "重启当前会话", key: "restart", run: () => { const pane = ensureActivePane(); if (pane) restartPane(pane); } },
        { name: "清屏", key: "clear", run: () => { const pane = ensureActivePane(); if (pane) { pane.term.clear(); pane.term.focus(); } } },
        { name: "SSH 快速连接", key: "ssh", run: () => { ui.sshbar.classList.toggle("show"); ui.sshHost.focus(); } },
        { name: "Telnet / Serial 连接", key: "conn", run: () => { ui.connbar.classList.toggle("show"); ui.connHost.focus(); } },
        { name: "SFTP 文件管理", key: "sftp", run: () => { ui.sftpPanel.classList.toggle("show"); } },
        { name: "导出会话日志", key: "export", run: exportPaneLog },
        { name: "终端设置", key: "settings", run: openSettings },
      ];
      function paletteFilter(query) {
        const list = PALETTE_ACTIONS.filter((a) => !query || a.name.toLowerCase().includes(query.toLowerCase()));
        ui.paletteList.textContent = "";
        for (const action of list) {
          const item = document.createElement("div");
          item.className = "palette-item";
          const name = document.createElement("span");
          name.textContent = action.name;
          const key = document.createElement("span");
          key.className = "key";
          key.textContent = action.key;
          item.append(name, key);
          item.addEventListener("click", () => { ui.paletteModal.classList.remove("show"); action.run(); });
          ui.paletteList.appendChild(item);
        }
      }
      function openPalette() { ui.paletteModal.classList.add("show"); paletteFilter(""); ui.paletteInput.value = ""; ui.paletteInput.focus(); }
      function closePalette() { ui.paletteModal.classList.remove("show"); }

      /* ── Recording: export pane transcript via serialize addon ── */
      async function exportPaneLog() {
        const pane = ensureActivePane();
        if (!pane || !pane.term) return;
        const text = "\u001b[0m" + pane.serialize.serialize();
        try {
          const save = await window.dbxPlugin.fileTransfer.beginSave({ fileName: `terminal-${Date.now()}.log` });
          if (!save || !save.handleId) {
            showFatal("当前 DBX 宿主未提供文件保存能力，无法导出日志");
            return;
          }
          const bytes = new TextEncoder().encode(text);
          const CHUNK = 512 * 1024;
          for (let offset = 0; offset < bytes.length; offset += CHUNK) {
            const slice = bytes.subarray(offset, Math.min(offset + CHUNK, bytes.length));
            let binary = "";
            for (let i = 0; i < slice.length; i += 0x8000) {
              binary += String.fromCharCode.apply(null, slice.subarray(i, Math.min(i + 0x8000, slice.length)));
            }
            await window.dbxPlugin.fileTransfer.write(save.handleId, offset, btoa(binary));
          }
          await window.dbxPlugin.fileTransfer.endSave(save.handleId);
        } catch (error) {
          showFatal(`导出失败: ${error.message || error}`);
        }
      }

      /* ── Telnet / Serial connection wizard ── */
      function bindConnWizard() {
        ui.connType.addEventListener("change", () => {
          const type = ui.connType.value;
          const isSerial = type === "serial";
          ui.serialPorts.style.display = isSerial ? "" : "none";
          ui.serialBaud.style.display = isSerial ? "" : "none";
          ui.connPort.style.display = isSerial ? "none" : "";
          ui.connPort.placeholder = type === "telnet" ? "23" : "22";
        });
        ui.connCancel.addEventListener("click", () => ui.connbar.classList.remove("show"));
        ui.connGo.addEventListener("click", () => {
          const pane = ensureActivePane();
          if (!pane) return;
          const type = ui.connType.value;
          sshTarget = null;
          pane.sshTarget = null;
          if (type === "serial") {

          } else {

          }
          ui.connbar.classList.remove("show");

        });

      }
      async function refreshSerialPorts() {
        try {
          const listing = await window.dbxPlugin.invoke("terminal/serialPorts", {}, { timeoutMs: 5000 });
          ui.serialPorts.textContent = "";
          for (const port of listing.ports || []) {

      /* ── SFTP panel ── */
      function sftpStatus(text) { ui.sftpStatus.textContent = text; }
      async function sftpBrowse(path) {
        sftpStatus("加载中…");
        try {
          const result = await window.dbxPlugin.invoke("sftp/list", {
            host: ui.sftpHost.value.trim(), port: Number(ui.sftpPort.value) || 22,
            user: ui.sftpUser.value.trim() || undefined, remotePath: path,
          }, { timeoutMs: 20000 });
          ui.sftpList.textContent = "";
          for (const entry of result.entries || []) {
            const row = document.createElement("div");
            row.className = "sftp-row";
            const icon = document.createElement("span");
            icon.textContent = entry.dir ? "📁" : "📄";
            const name = document.createElement("span");
            name.textContent = entry.name;
            name.style.flex = "1";
            const size = document.createElement("span");
            size.className = "size";
            size.textContent = entry.dir ? "" : `${Math.max(1, Math.round(entry.size / 1024))}K`;
            const download = document.createElement("button");
            download.className = "act"; download.textContent = "下载";
            download.addEventListener("click", (event) => { event.stopPropagation(); sftpDownload(entry); });
            const del = document.createElement("button");
            del.className = "act"; del.textContent = "删";
            del.addEventListener("click", async (event) => {
              event.stopPropagation();
              await window.dbxPlugin.invoke("sftp/delete", sftpParams(entry.name.startsWith("/") ? entry.name : joinPath(ui.sftpPath.value, entry.name)), { timeoutMs: 20000 });
              sftpRefresh();
            });
            row.append(icon, name, size, download, del);
            row.addEventListener("click", () => {
              if (!entry.dir) return;
              ui.sftpPath.value = joinPath(ui.sftpPath.value, entry.name);
              sftpRefresh();
            });
            ui.sftpList.appendChild(row);
          }
          if (!(result.entries || []).length) {
            const empty = document.createElement("div");
            empty.className = "sftp-row"; empty.textContent = "（空目录）";
            ui.sftpList.appendChild(empty);
          }
          sftpStatus("");
        } catch (error) {
          sftpStatus(String(error.message || error).slice(0, 80));
        }
      }
      function joinPath(base, name) {
        if (name.startsWith("/")) return name;
        return (base.endsWith("/") ? base : base + "/") + name;
      }
      function sftpParams(remotePath) {
        return { host: ui.sftpHost.value.trim(), port: Number(ui.sftpPort.value) || 22, user: ui.sftpUser.value.trim() || undefined, remotePath };
      }
      function sftpRefresh() { sftpBrowse(ui.sftpPath.value.trim() || "/"); }
      async function sftpDownload(entry) {
        const remotePath = entry.name.startsWith("/") ? entry.name : joinPath(ui.sftpPath.value, entry.name);
        sftpStatus("下载中…");
        try {
          const result = await window.dbxPlugin.invoke("sftp/download", sftpParams(remotePath), { timeoutMs: 60000 });
          const save = await window.dbxPlugin.fileTransfer.beginSave({ fileName: result.name });
          const B64_CHUNK = 4 * 256 * 1024; // 4-char aligned: 3 bytes per 4 chars
          const b64 = result.dataBase64;
          for (let charOffset = 0; charOffset < b64.length; charOffset += B64_CHUNK) {
            const sliceB64 = b64.slice(charOffset, charOffset + B64_CHUNK);
            await window.dbxPlugin.fileTransfer.write(save.handleId, Math.floor(charOffset / 4) * 3, sliceB64);
          }
          await window.dbxPlugin.fileTransfer.endSave(save.handleId);
          sftpStatus(`已保存 ${result.name}`);
        } catch (error) {
          sftpStatus(String(error.message || error).slice(0, 80));
        }
      }
      async function sftpUpload() {
        try {
          const picked = await window.dbxPlugin.fileTransfer.pick({});
          const files = Array.isArray(picked) ? picked : (picked ? [picked] : []);
          if (!files.length) return;
          for (const file of files) {
            const dataBase64 = file.dataBase64 || "";
            const remotePath = joinPath(ui.sftpPath.value.trim() || "/", file.name || `upload-${Date.now()}`);
            sftpStatus(`上传 ${file.name || remotePath}…`);
            await window.dbxPlugin.invoke("sftp/upload", { ...sftpParams(remotePath), dataBase64 }, { timeoutMs: 60000 });
          }
          sftpStatus("上传完成");
          sftpRefresh();
        } catch (error) {
          sftpStatus(String(error.message || error).slice(0, 80));
        }
      }
      function bindSftp() {
        ui.sftpToggle.addEventListener("click", () => { ui.sftpPanel.classList.toggle("show"); });
        // 左侧面板由图标栏控制，不再需要独立关闭按钮
        ui.sftpOpen.addEventListener("click", sftpRefresh);
        ui.sftpRefresh.addEventListener("click", sftpRefresh);
        ui.sftpMkdir.addEventListener("click", async () => {
          const name = prompt("目录名:");
          if (!name) return;
          await window.dbxPlugin.invoke("sftp/mkdir", sftpParams(joinPath(ui.sftpPath.value, name)), { timeoutMs: 20000 }).catch((e) => sftpStatus(String(e.message || e)));
          sftpRefresh();
        });
        ui.sftpUpload.addEventListener("click", sftpUpload);
      }

      function startPaneSession(pane) {
        const opts = pane.pendingStart || {};
        pane.pendingStart = null;
        let params;
        if (opts.sshTarget) {
          params = { shell: "ssh", host: opts.sshTarget.host, port: opts.sshTarget.port, user: opts.sshTarget.user || undefined, cols: pane.term.cols, rows: pane.term.rows };
        } else if (opts.shell === "telnet" || opts.shell === "serial") {
          params = { shell: opts.shell, host: opts.host, port: opts.port, user: opts.user, serialPath: opts.serialPath, baud: opts.baud, cols: pane.term.cols, rows: pane.term.rows };
        } else {
          params = { shell: opts.shell || ui.shell.value || undefined, cols: pane.term.cols, rows: pane.term.rows };
        }
        window.dbxPlugin.invoke("terminal/start", params, { timeoutMs: 15000 }).then((result) => {
          const displayName = opts.sshTarget
            ? copy.sshTarget(`${opts.sshTarget.user ? `${opts.sshTarget.user}@` : ""}${opts.sshTarget.host}`)
            : opts.shell === "telnet" ? `telnet ${opts.host || ""}`
            : opts.shell === "serial" ? `serial ${opts.serialPath || ""}@${opts.baud || ""}`
            : (result.shell || "");
          pane.session = {
            id: result.sessionId,
            exited: false,
            code: null,
            shell: result.shell || "",
            displayName,
          };
          if (opts.sshTarget) pane.sshTarget = opts.sshTarget;
          if (activePaneId === pane.id) { updateBadge(); updateStatus(); }
          renderTabs();
          pane.term.focus();
        }).catch((error) => {
          pane.session = { id: null, exited: true, code: null, shell: params.shell || "", displayName: params.shell || "" };
          setBadge("exited", copy.exited);
          showFatal(copy.startFail(error.message || error));
          renderTabs();
        });
      }

      function stopPaneSession(pane) {
        if (pane.session && pane.session.id !== null) {
          window.dbxPlugin.invoke("terminal/stop", { sessionId: pane.session.id }, { timeoutMs: 3000 }).catch(() => {});
          pane.session = null;
        }
      }

      function restartPane(pane) {
        pane.exitLayer.classList.remove("show");
        stopPaneSession(pane);
        pane.term.reset();
        // Callers may pre-set pendingStart (SSH/Telnet/Serial wizard); only
        // fall back when they did not.
        if (!pane.pendingStart) pane.pendingStart = pane.sshTarget ? { sshTarget: pane.sshTarget } : {};
        startPaneSession(pane);
      }

      function wirePaneTerm(pane) {
        pane.term.onData((data) => {
          if (pane.session && pane.session.id !== null && !pane.session.exited) {
            window.dbxPlugin.sendBinary("terminal/input", packFrame(pane.session.id, new TextEncoder().encode(data))).catch(() => {});
          }
        });
        pane.term.onBinary((data) => {
          if (!pane.session || pane.session.id === null || pane.session.exited) return;
          const bytes = new Uint8Array(data.length);
          for (let i = 0; i < data.length; i += 1) bytes[i] = data.charCodeAt(i) & 0xff;
          window.dbxPlugin.sendBinary("terminal/input", packFrame(pane.session.id, bytes)).catch(() => {});
        });
        pane.term.attachCustomKeyEventHandler((event) => {
          if (event.type !== "keydown") return true;
          if (event.ctrlKey && event.key === "f" && !event.shiftKey && !event.altKey) { openSearch(); return false; }
          if (event.key === "Escape" && ui.searchbar.classList.contains("show")) { closeSearch(); return false; }
          if (event.ctrlKey && event.shiftKey && (event.key === "C" || event.key === "c")) {
            const selection = pane.term.getSelection();
            if (selection) { navigator.clipboard?.writeText(selection).catch(() => {}); return false; }
          }
          if (event.ctrlKey && !event.shiftKey && event.key === "v") {
            navigator.clipboard?.readText().then((text) => {
              if (text && pane.session && pane.session.id !== null && !pane.session.exited) {
                window.dbxPlugin.sendBinary("terminal/input", packFrame(pane.session.id, new TextEncoder().encode(text))).catch(() => {});
              }
            }).catch(() => {});
            return false;
          }
          return true;
        });
        pane.term.onResize(() => scheduleFit());
      }

      function buildPaneInto(pane, container) {
        const el = document.createElement("div");
        el.className = "pane";
        pane.el = el;
        const host = document.createElement("div");
        host.className = "term-host";
        const termEl = document.createElement("div");
        termEl.style.height = "100%";
        host.appendChild(termEl);
        const corner = document.createElement("span");
        corner.className = "pane-corner";
        const exitLayer = document.createElement("div");
        exitLayer.className = "pane-exit";
        const exitCode = document.createElement("span");
        exitCode.className = "code";
        const exitRestart = document.createElement("button");
        exitRestart.className = "btn primary";
        exitRestart.textContent = copy.restart;
        exitRestart.addEventListener("click", () => restartPane(pane));
        exitLayer.append(exitCode, exitRestart);
        el.append(host, corner, exitLayer);
        pane.exitLayer = exitLayer;
        pane.exitCodeEl = exitCode;
        container.appendChild(el);
        pane.term = makeTerm();
        pane.fit = new window.FitAddon.FitAddon();
        pane.search = new window.SearchAddon.SearchAddon();
        pane.term.loadAddon(pane.fit);
        pane.term.loadAddon(pane.search);
        pane.serialize = new window.SerializeAddon.SerializeAddon();
        pane.term.loadAddon(pane.serialize);
        pane.term.open(termEl);
        wirePaneTerm(pane);
        el.addEventListener("mousedown", () => setActivePane(pane.id));
        pane.term.focus();
      }

      /* ── Layout ──────────────────────────────────────────────── */
      function scheduleFit() {
        requestAnimationFrame(() => {
          const tab = activeTab();
          if (!tab) return;
          forTree(tab.root, (pane) => {
            if (!pane.el || !pane.fit) return;
            try { pane.fit.fit(); } catch { /* not measurable yet */ }
            if (pane.session && pane.session.id !== null && !pane.session.exited) {
              window.dbxPlugin.invoke("terminal/resize", { sessionId: pane.session.id, cols: pane.term.cols, rows: pane.term.rows }, { timeoutMs: 3000 }).catch(() => {});
            }
          });
          updateStatus();
        });
      }

      function renderTabs() {
        ui.tabs.textContent = "";
        for (const tab of tabs) {
          const el = document.createElement("span");
          el.className = "tab" + (tab.id === activeTabId ? " active" : "");
          let running = false, any = false;
          forTree(tab.root, (pane) => { if (pane.session) { any = true; if (!pane.session.exited) running = true; } });
          const state = document.createElement("span");
          state.className = "tstate " + (any && running ? "running" : "exited");
          const name = document.createElement("span");
          name.className = "tname";
          name.textContent = tab.name;
          const close = document.createElement("button");
          close.className = "tclose";
          close.textContent = "×";
          close.title = "Close";
          close.addEventListener("click", (event) => { event.stopPropagation(); closeTab(tab.id); });
          el.addEventListener("click", () => { activeTabId = tab.id; const first = { id: null }; forTree(tab.root, (pane) => { if (first.id === null) first.id = pane.id; }); activePaneId = first.id; renderTabs(); renderPanes(); updateBadge(); updateStatus(); });
          el.append(state, name, close);
          ui.tabs.appendChild(el);
        }
        const add = document.createElement("button");
        add.id = "new-tab";
        add.textContent = "+";
        add.title = "New tab";
        add.addEventListener("click", () => newTab());
        ui.tabs.appendChild(add);
      }

      function renderPanes() {
        const tab = activeTab();
        if (!tab) return;
        const build = (node, parent) => {
          if (node.kind === "split") {
            const el = document.createElement("div");
            el.className = `split ${node.dir}`;
            parent.appendChild(el);
            build(node.a, el);
            build(node.b, el);
          } else {
            const pane = panesById.get(node.id);
            if (!pane) return;
            if (pane.el) {
              pane.el.classList.toggle("active", node.id === activePaneId);
              parent.appendChild(pane.el);
            } else if (xtermReady) {
              buildPaneInto(pane, parent);
              pane.el.classList.toggle("active", node.id === activePaneId);
            }
          }
        };
        ui.panes.textContent = "";
        build(tab.root, ui.panes);
        scheduleFit();
      }

      function setActivePane(paneId) {
        activePaneId = paneId;
        const tab = activeTab();
        if (tab) forTree(tab.root, (pane) => pane.el && pane.el.classList.toggle("active", pane.id === paneId));
        const pane = panesById.get(paneId);
        if (pane) pane.term.focus();
        updateBadge();
        updateStatus();
      }

      function newTab(opts) {
        const tab = { id: nextTabId++, name: copy.tab(nextTabNumber++), root: null };
        const pane = { id: nextPaneId++, kind: "pane", parent: null, el: null, term: null, fit: null, search: null, session: null, pendingStart: opts || {} };
        panesById.set(pane.id, pane);
        tab.root = pane;
        tabs.push(tab);
        activeTabId = tab.id;
        activePaneId = pane.id;
        renderTabs();
        renderPanes();
        setActivePane(pane.id);
        requestAnimationFrame(() => { try { pane.fit.fit(); } catch {} startPaneSession(pane); });
        return { tab, pane };
      }

      function closeTab(tabId) {
        const index = tabs.findIndex((tab) => tab.id === tabId);
        if (index === -1) return;
        const tab = tabs[index];
        const ids = [];
        collectSessions(tab.root, ids);
        for (const sid of ids) window.dbxPlugin.invoke("terminal/stop", { sessionId: sid }, { timeoutMs: 3000 }).catch(() => {});
        forTree(tab.root, (pane) => panesById.delete(pane.id));
        tabs.splice(index, 1);
        if (tabs.length === 0) { newTab(); return; }
        if (activeTabId === tabId) {
          const next = tabs[Math.max(0, index - 1)];
          activeTabId = next.id;
          const first = { id: null };
          forTree(next.root, (pane) => { if (first.id === null) first.id = pane.id; });
          activePaneId = first.id;
        }
        renderTabs();
        renderPanes();
        updateBadge();
        updateStatus();
      }

      function splitActive(dir) {
        const tab = activeTab();
        const pane = activePane();
        if (!tab || !pane) return;
        const newPane = { id: nextPaneId++, kind: "pane", parent: null, el: null, term: null, fit: null, search: null, session: null, pendingStart: {} };
        panesById.set(newPane.id, newPane);
        const split = { kind: "split", dir, a: pane, b: newPane, parent: pane.parent };
        pane.parent = split;
        newPane.parent = split;
        if (!split.parent) tab.root = split;
        else if (split.parent.a === pane) split.parent.a = split;
        else split.parent.b = split;
        activePaneId = newPane.id;
        renderTabs();
        renderPanes();
        setActivePane(newPane.id);
        startPaneSession(newPane);
      }

      function closeActivePane() {
        const tab = activeTab();
        const pane = activePane();
        if (!tab || !pane) return;
        if (!pane.parent) { closeTab(tab.id); return; }
        stopPaneSession(pane);
        const parent = pane.parent;
        const sibling = parent.a === pane ? parent.b : parent.a;
        const grand = parent.parent;
        sibling.parent = grand;
        if (!grand) tab.root = sibling;
        else if (grand.a === parent) grand.a = sibling;
        else grand.b = sibling;
        panesById.delete(pane.id);
        const first = { id: null };
        forTree(tab.root, (p) => { if (first.id === null) first.id = p.id; });
        activePaneId = first.id;
        renderTabs();
        renderPanes();
        setActivePane(activePaneId);
      }

      /* ── Binary routing ──────────────────────────────────────── */
      function routeBinary(payload) {
        if (payload.channel === "terminal/output" && payload.data instanceof Uint8Array && payload.data.length >= 4) {
          const sid = new DataView(payload.data.buffer, payload.data.byteOffset, 4).getUint32(0, true);
          const pane = paneBySession(sid);
          if (pane) pane.term.write(payload.data.subarray(4));
        } else if (payload.channel === "terminal/exit") {
          // Frame = u32 LE session id + ASCII exit code.
          if (!(payload.data instanceof Uint8Array) || payload.data.length < 5) return;
          const sid = new DataView(payload.data.buffer, payload.data.byteOffset, 4).getUint32(0, true);
          const code = Number(new TextDecoder().decode(payload.data.subarray(4)).trim() || "0");
          const pane = paneBySession(sid);
          if (pane && pane.session && pane.session.id === sid && !pane.session.exited) {
            pane.session.exited = true;
            pane.session.code = code;
            pane.exitCodeEl.textContent = copy.exitLine(code);
            pane.exitLayer.classList.add("show");
            renderTabs();
            updateBadge();
            updateStatus();
          }
        }
      }

      /* ── Search ──────────────────────────────────────────────── */
      function openSearch() { ui.searchbar.classList.add("show"); ui.searchInput.focus(); ui.searchInput.select(); }
      function closeSearch() {
        ui.searchbar.classList.remove("show");
        const pane = activePane();
        if (pane) { try { pane.search.clearDecorations(); } catch {} pane.term.focus(); }
      }
      function runSearch(direction) {
        const pane = activePane();
        const query = ui.searchInput.value;
        if (!pane || !query) { ui.searchCount.textContent = ""; return; }
        try { if (direction === "prev") pane.search.findPrevious(query); else pane.search.findNext(query); } catch { /* not ready */ }
      }
      function bindSearch() {
        ui.searchInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") { event.preventDefault(); runSearch(event.shiftKey ? "prev" : "next"); }
          if (event.key === "Escape") { event.preventDefault(); closeSearch(); }
        });
        ui.searchInput.addEventListener("input", () => runSearch("next"));
        ui.searchNext.addEventListener("click", () => runSearch("next"));
        ui.searchPrev.addEventListener("click", () => runSearch("prev"));
        ui.searchClose.addEventListener("click", closeSearch);
      }

      /* ── Init ────────────────────────────────────────────────── */
      async function init() {
        if (!window.dbxPlugin) { showFatal(copy.noHost); return; }
        await window.dbxPlugin.ready;
        applyLocale(window.dbxPlugin.locale);

        try {
          const listing = await window.dbxPlugin.invoke("terminal/shells", {}, { timeoutMs: 5000 });
          availableShells = (listing.shells || []).filter((shell) => shell.available && shell.id !== "ssh").map((shell) => shell.id);
        } catch { availableShells = SHELLS.map((shell) => shell.value); }
        if (!availableShells.length) availableShells = ["powershell"];
        for (const shell of SHELLS.filter((shell) => availableShells.includes(shell.value))) {
          const option = document.createElement("option");
          option.value = shell.value;
          option.textContent = shell.label;
          ui.shell.appendChild(option);
        }
        ui.shell.value = availableShells.includes("powershell") ? "powershell" : availableShells[0];

        try {
          injectCss(await loadAssetText("assets/vendor/xterm.css"));
          await loadScriptText(await loadAssetText("assets/vendor/xterm.js"));
          await loadScriptText(await loadAssetText("assets/vendor/addon-fit.js"));
          await loadScriptText(await loadAssetText("assets/vendor/addon-search.js"));
          await loadScriptText(await loadAssetText("assets/vendor/addon-serialize.js"));
        } catch (error) {
          showFatal(`${copy.loadFail}\n${error}`);
          return;
        }

        xtermReady = true;

        await loadSettings();
        applySettingsToPanes();
        bindConnWizard();
        bindSftp();
        bindQuickbar();
        // NyaTerm-style rails & panels
        ui.railFiles.addEventListener("click", () => { ui.panelLeft.classList.toggle("show"); ui.railFiles.classList.toggle("active"); });
        ui.railConn.addEventListener("click", () => { ui.connbar.classList.toggle("show"); ui.connHost.focus(); });
        ui.railPalette.addEventListener("click", openPalette);
        ui.railMonitor.addEventListener("click", () => { ui.panelRight.classList.toggle("show"); ui.railMonitor.classList.toggle("active"); startMonitor(); });
        ui.railSettings.addEventListener("click", openSettings);
        // System monitor polling
        let prevNet = null;
        async function pollStats() {
          if (!ui.panelRight.classList.contains("show")) return;
          try {
            const s = await window.dbxPlugin.invoke("system/stats", {}, { timeoutMs: 5000 });
            const gb = (v) => (v / 1073741824).toFixed(1);
            $("mon-cpu-val").textContent = s.cpu + "%";
            const cores = $("mon-cpu-cores");
            if (s.perCore && cores.childElementCount !== s.perCore.length) {
              cores.textContent = "";
              s.perCore.forEach((usage, i) => {
                const row = document.createElement("div");
                row.className = "core-row";
                const label = document.createElement("span"); label.textContent = i + 1;
                const bar = document.createElement("div"); bar.className = "cbar";
                const fill = document.createElement("div"); fill.className = "cfill";
                bar.appendChild(fill);
                row.append(label, bar);
                cores.appendChild(row);
              });
            }
            if (s.perCore) {
              [...cores.querySelectorAll(".cfill")].forEach((fill, i) => { fill.style.width = Math.min(100, s.perCore[i] || 0) + "%"; });
            }
            const memPct = s.memTotal ? Math.round((s.memUsed / s.memTotal) * 100) : 0;
            $("mon-mem-val").textContent = memPct + "%";
            $("mon-mem-bar").style.width = memPct + "%";
            $("mon-mem-text").textContent = `${gb(s.memUsed)} / ${gb(s.memTotal)} GB`;
            const diskPct = s.diskTotal ? Math.round(((s.diskTotal - s.diskAvail) / s.diskTotal) * 100) : 0;
            $("mon-disk-bar").style.width = diskPct + "%";
            $("mon-disk-text").textContent = `${gb(s.diskTotal - s.diskAvail)} / ${gb(s.diskTotal)} GB`;
            if (prevNet) {
              $("mon-net-val").textContent = `${gb(Math.max(0, s.netRx - prevNet.rx))}GB ↓ / ${gb(Math.max(0, s.netTx - prevNet.tx))}GB ↑`;
            }
            prevNet = { rx: s.netRx, tx: s.netTx };
          } catch { /* backend busy */ }
        }
        setInterval(pollStats, 2000);
        // Quick commands bar
        function qbSend(cmd) {
          const pane = ensureActivePane();
          if (!pane || !pane.session || pane.session.id === null || pane.session.exited) return;
          window.dbxPlugin.sendBinary("terminal/input", packFrame(pane.session.id, new TextEncoder().encode(cmd + "\r"))).catch(() => {});
          pane.term.focus();
        }
        function qbRender() {
          ui.qbChips.textContent = "";
          for (const cmd of (settings.quickCommands || [])) {
            const chip = document.createElement("span");
            chip.className = "qb-chip";
            const label = document.createElement("span");
            label.textContent = cmd;
            label.addEventListener("click", () => qbSend(cmd));
            const x = document.createElement("span");
            x.className = "qx"; x.textContent = "×";
            x.addEventListener("click", async (event) => {
              event.stopPropagation();
              settings.quickCommands = (settings.quickCommands || []).filter((c) => c !== cmd);
              try { await window.dbxPlugin.storage.set("terminalSettings", settings); } catch {}
              qbRender();
            });
            chip.append(label, x);
            ui.qbChips.appendChild(chip);
          }
          if (!(settings.quickCommands || []).length) {
            const hint = document.createElement("span");
            hint.className = "qb-title";
            hint.textContent = "在右侧输入框添加常用命令";
            ui.qbChips.appendChild(hint);
          }
        }
        function bindQuickbar() {
          qbRender();
          ui.qbAdd.addEventListener("click", async () => {
            const cmd = ui.qbInput.value.trim();
            if (!cmd) return;
            settings.quickCommands = [...(settings.quickCommands || []), cmd];
            try { await window.dbxPlugin.storage.set("terminalSettings", settings); } catch {}
            ui.qbInput.value = "";
            qbRender();
          });
          ui.qbInput.addEventListener("keydown", (event) => { if (event.key === "Enter") { event.preventDefault(); ui.qbAdd.click(); } });
        }
        window.dbxPlugin.onBinary(routeBinary);

        // First tab; if opened from a saved SSH connection, land in the remote session.
        let firstOpts = {};
        try {
          const context = window.dbxPlugin.context;
          if (context && context.connectionId) {
            const info = await window.dbxPlugin.invoke("terminal/connectionInfo", { connectionId: context.connectionId }, { timeoutMs: 5000 });
            if (info && info.found && info.host) {
              sshTarget = { host: info.host, port: info.port || "22", user: info.user || "" };
              firstOpts = { sshTarget };
            }
          }
        } catch { /* not a saved SSH connection */ }
        newTab(firstOpts);

        await loadSettings();
        applySettingsToPanes();
        bindConnWizard();
        bindSftp();

        // Settings / palette / record bindings.
        ui.settingsToggle.addEventListener("click", openSettings);
        ui.settingsClose.addEventListener("click", closeSettings);
        ui.settingsSave.addEventListener("click", async () => { await saveSettings(); closeSettings(); });
        ui.paletteModal.addEventListener("click", (event) => { if (event.target === ui.paletteModal) closePalette(); });
        ui.paletteInput.addEventListener("input", () => paletteFilter(ui.paletteInput.value));
        ui.paletteInput.addEventListener("keydown", (event) => {
          const items = [...ui.paletteList.querySelectorAll(".palette-item")];
          const index = items.findIndex((item) => item.classList.contains("sel"));
          if (event.key === "Escape") { event.preventDefault(); closePalette(); }
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            const next = event.key === "ArrowDown" ? Math.min(index + 1, items.length - 1) : Math.max(index - 1, 0);
            items.forEach((item, i) => item.classList.toggle("sel", i === next));
          }
          if (event.key === "Enter") { event.preventDefault(); const sel = items.find((item) => item.classList.contains("sel")) || items[0]; if (sel) sel.click(); }
        });
        document.addEventListener("keydown", (event) => {
          if (event.ctrlKey && event.shiftKey && (event.key === "P" || event.key === "p")) { event.preventDefault(); openPalette(); }
        });
        ui.recordToggle.addEventListener("click", exportPaneLog);

        // Theme/locale hot updates.
        window.dbxPlugin.onEvent((message) => {
          if (message && typeof message === "object") {
            if (message.theme) for (const [, pane] of panesById) if (pane.term) pane.term.options.theme = xtermPalette();
            if (message.locale) applyLocale(message.locale);
          }
        });
      }

      /* ── Toolbar bindings ────────────────────────────────────── */
      ui.shell.addEventListener("change", () => {
        const pane = ensureActivePane();
        if (!pane) return;
        pane.sshTarget = null;
        pane.pendingStart = {};
        restartPane(pane);
      });
      ui.restart.addEventListener("click", () => { const pane = ensureActivePane(); if (pane) restartPane(pane); });
      ui.clear.addEventListener("click", () => { const pane = ensureActivePane(); if (pane) { pane.term.clear(); pane.term.focus(); } });
      ui.splitH.addEventListener("click", () => splitActive("h"));
      ui.splitV.addEventListener("click", () => splitActive("v"));
      ui.closePane.addEventListener("click", closeActivePane);
      ui.fontMinus.addEventListener("click", () => { fontSize = Math.max(9, fontSize - 1); for (const [, pane] of panesById) if (pane.term) pane.term.options.fontSize = fontSize; scheduleFit(); });
      ui.fontPlus.addEventListener("click", () => { fontSize = Math.min(28, fontSize + 1); for (const [, pane] of panesById) if (pane.term) pane.term.options.fontSize = fontSize; scheduleFit(); });
      ui.searchToggle.addEventListener("click", () => (ui.searchbar.classList.contains("show") ? closeSearch() : openSearch()));
      bindSearch();
      ui.sshToggle.addEventListener("click", () => {
        ui.sshbar.classList.toggle("show");
        if (ui.sshbar.classList.contains("show")) ui.sshHost.focus();
      });
      ui.sshCancel.addEventListener("click", () => ui.sshbar.classList.remove("show"));
      const connectSsh = () => {
        const host = ui.sshHost.value.trim();
        if (!host) { ui.sshHost.focus(); return; }
        sshTarget = { host, port: ui.sshPort.value.trim() || "22", user: ui.sshUser.value.trim() };
        ui.sshbar.classList.remove("show");
        const pane = ensureActivePane();
        if (!pane) return;
        pane.sshTarget = sshTarget;
        restartPane(pane);
      };
      ui.sshConnect.addEventListener("click", connectSsh);
      for (const input of [ui.sshUser, ui.sshHost, ui.sshPort]) {
        input.addEventListener("keydown", (event) => { if (event.key === "Enter") { event.preventDefault(); connectSsh(); } });
      }
      new ResizeObserver(() => scheduleFit()).observe(ui.panes);

      if (window.dbxPlugin && window.dbxPlugin.workbench && typeof window.dbxPlugin.workbench.onClose === "function") {
        window.dbxPlugin.workbench.onClose(() => {
          const ids = [];
          for (const tab of tabs) collectSessions(tab.root, ids);
          for (const sid of ids) window.dbxPlugin.invoke("terminal/stop", { sessionId: sid }, { timeoutMs: 1500 }).catch(() => {});
        });
      }

      // Surface every async failure on-screen instead of dying silently.
      window.addEventListener("error", (event) => {
        showFatal(`${event.message} @ ${event.filename}:${event.lineno}`);
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        showFatal(`Unhandled rejection: ${reason && (reason.stack || reason.message || String(reason))}`);
      });

      init().catch((error) => showFatal(String(error && error.stack || error)));
    </script>
  </body>
</html>
